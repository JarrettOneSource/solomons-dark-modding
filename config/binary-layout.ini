[game_over.native]
; GameOver CPU identity used by read-only live acceptance to distinguish the
; stock Boneyard fade-only presentation from an arbitrary dark frame.
vtable=0x0079B0CC
; Nonzero selects the stock Boneyard/survival GameOver branch. That branch
; suppresses GAME / OVER / CLICK and returns through the stock front end.
boneyard_mode=0x0081A434
; GameOver::Tick owns input, fade, stock completed-run cleanup, and post-run
; presentation selection.
tick=0x005CF4F0
render=0x005C9030
; GameOver vtable +0x18 unregisters the surface and marks it closed.
close_surface=0x004277B0
; Archives native completed-run/inventory state before Mortuary construction.
completed_run_cleanup=0x005C9670
gameplay_scene_factory=0x005B7080
gameplay_switch_region=0x005CDDD0
; Boneyard completion chooses and installs the stock front-end surface.
boneyard_front_end_dispatch=0x005A7F60
; The Boneyard branch installs a MainMenu controller at application +0xDAC.
; Opening the post-run front end constructs a HallOfFame controller at +0xDB0.
; Its input virtual sets +0x7C to 1.0; HallOfFame::Tick advances that fade and
; calls the stock MainMenu installer once +0x78 exceeds 1.0.
application_global=0x00B401A8
application_main_menu_offset=0x0DAC
application_hall_of_fame_offset=0x0DB0
post_run_main_menu=0x005A7D90
hall_of_fame_factory=0x005A7E30
hall_of_fame_vftable=0x00799334
hall_of_fame_tick=0x00589CD0
hall_of_fame_continue=0x00589DB0
; The input virtual ends with RET 4 and consumes one ignored stack argument.
hall_of_fame_continue_stack_bytes=0x04
; Read-only acceptance walks the application's CPU-surface manager and reads
; only the exact GameOver object's presentation state.
application_cpu_manager=0x44
cpu_manager_count=0x08
cpu_manager_items=0x14
surface_closed=0x05
background_alpha=0x78
title_alpha=0x7C
click_alpha=0x80
close_alpha=0xA4
tick_count=0xAC

