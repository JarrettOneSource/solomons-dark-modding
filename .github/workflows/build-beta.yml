name: Build beta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve release identity
        id: release
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = ([string]$props.Project.PropertyGroup.Version).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Directory.Build.props does not declare a version."
          }
          $archive = Join-Path $env:RUNNER_TEMP "artifacts/SolomonDarkMultiplayerBeta-v$version.zip"
          "BETA_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BETA_ARCHIVE=$archive" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "archive=$archive" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run Windows x86 launcher contracts
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "tests/launcher-contracts/bin/ci-win-x86"
          dotnet publish tests/launcher-contracts/SolomonDarkModLauncher.ContractTests.csproj `
            -c Release `
            -r win-x86 `
            --self-contained true `
            -o $output
          if ($LASTEXITCODE -ne 0) {
            throw "Launcher contract publish failed with exit code $LASTEXITCODE."
          }
          & (Join-Path $output "SolomonDarkModLauncher.ContractTests.exe")
          if ($LASTEXITCODE -ne 0) {
            throw "Launcher contracts failed with exit code $LASTEXITCODE."
          }

      - name: Download package prerequisites
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloads = Join-Path $env:RUNNER_TEMP "prerequisites"
          $oldBeta = Join-Path $downloads "SolomonDarkMultiplayerBeta-v0.1.0-beta.8.zip"
          $gameArchive = Join-Path $downloads "Solomons-Dark-0.72.5-Original-Game.zip"
          New-Item -ItemType Directory -Path $downloads -Force | Out-Null

          gh release download v0.1.0-beta.8 `
            --repo $env:GITHUB_REPOSITORY `
            --pattern "SolomonDarkMultiplayerBeta-v0.1.0-beta.8.zip" `
            --dir $downloads
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download the canonical Steam runtime."
          }
          gh release download v0.1.0-beta.8 `
            --repo $env:GITHUB_REPOSITORY `
            --pattern "Solomons-Dark-0.72.5-Original-Game.zip" `
            --dir $downloads
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download the canonical original game."
          }

          $oldBetaRoot = Join-Path $downloads "old-beta"
          $gameRoot = Join-Path $downloads "original-game"
          Expand-Archive $oldBeta -DestinationPath $oldBetaRoot -Force
          Expand-Archive $gameArchive -DestinationPath $gameRoot -Force

          $steamApi = Get-ChildItem $oldBetaRoot -Recurse -File -Filter steam_api.dll |
            Where-Object { $_.FullName -match 'launcher[\\/]assets[\\/]steam[\\/]win32' } |
            Select-Object -First 1
          if (-not $steamApi) {
            throw "The canonical beta does not contain launcher/assets/steam/win32/steam_api.dll."
          }

          $gameExecutable = Get-ChildItem $gameRoot -Recurse -File -Filter SolomonDark.exe |
            Select-Object -First 1
          if (-not $gameExecutable) {
            throw "The canonical original-game archive does not contain SolomonDark.exe."
          }

          "STEAM_API_DLL=$($steamApi.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GAME_DIRECTORY=$($gameExecutable.DirectoryName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build portable beta
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts/New-BetaReleasePackage.ps1 `
            -OutputDirectory (Split-Path $env:BETA_ARCHIVE) `
            -SteamApiDll $env:STEAM_API_DLL
          if ($LASTEXITCODE -ne 0) {
            throw "Beta packaging failed with exit code $LASTEXITCODE."
          }

      - name: Verify portable beta structure
        shell: pwsh
        run: |
          python tools/verify_beta_release_artifact.py `
            $env:BETA_ARCHIVE `
            --version $env:BETA_VERSION `
            --output (Join-Path $env:RUNNER_TEMP "beta-release-artifact.json")
          if ($LASTEXITCODE -ne 0) {
            throw "Beta artifact verification failed with exit code $LASTEXITCODE."
          }

      - name: Smoke-test extracted beta
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts/Test-BetaReleasePackage.ps1 `
            -ArchivePath $env:BETA_ARCHIVE `
            -GameDirectory $env:GAME_DIRECTORY `
            -OutputPath (Join-Path $env:RUNNER_TEMP "beta-release-package-smoke.json")
          if ($LASTEXITCODE -ne 0) {
            throw "Beta package smoke test failed with exit code $LASTEXITCODE."
          }

      - name: Report archive digest
        shell: pwsh
        run: Get-FileHash $env:BETA_ARCHIVE -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: beta-${{ steps.release.outputs.version }}
          path: |
            ${{ steps.release.outputs.archive }}
            ${{ runner.temp }}/beta-release-artifact.json
            ${{ runner.temp }}/beta-release-package-smoke.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
