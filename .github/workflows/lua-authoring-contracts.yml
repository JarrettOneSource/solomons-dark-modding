name: Lua authoring contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  generated-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The repository identity census reads all reachable history;
          # a shallow clone makes it pass vacuously.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image test dependency
        run: python -m pip install Pillow==11.3.0
      - name: Test repository identity contract
        # Push events only: a pull_request build checks out a synthetic
        # merge commit that GitHub itself authors, which is not a project
        # identity. Branch commits are censused when they land on main.
        if: github.event_name == 'push'
        run: python tests/re/repository_identity_contract.py
      - name: Verify generated Lua editor API
        run: python tools/generate_lua_api_stubs.py --check
      - name: Test Lua editor API generator
        run: python -m unittest tests.test_lua_api_stub_generator
      - name: Test Lua authoring live verifier
        run: python -m unittest tests.test_lua_authoring_verifier
      - name: Test Lua multiplayer authoring verifier
        run: python -m unittest tests.test_lua_authoring_multiplayer_verifier
      - name: Test Lua UI authoring verifier
        run: python -m unittest tests.test_lua_ui_authoring_verifier
      - name: Test Lua spell picker verifier
        run: python -m unittest tests.test_lua_spells_verifier
      - name: Test Lua multiplayer spell verifier
        run: python -m unittest tests.test_lua_spells_multiplayer_verifier
      - name: Test launcher/native protocol alignment
        run: python -m unittest tests.test_protocol_version_alignment
      - name: Test Lua content identity registry
        run: >-
          g++ -std=c++17
          -ISolomonDarkModLoader/include
          SolomonDarkModLoader/src/lua_content_registry.cpp
          tests/native/lua_content_registry_tests.cpp
          -o /tmp/lua-content-registry-tests
          && /tmp/lua-content-registry-tests
      - name: Test shared mod-settings validation vectors
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -ISolomonDarkModLoader/include
          -ISolomonDarkModLoader/src
          SolomonDarkModLoader/src/mod_settings_json.cpp
          SolomonDarkModLoader/src/mod_settings.cpp
          SolomonDarkModLoader/src/mod_settings_list.cpp
          SolomonDarkModLoader/src/mod_settings_values.cpp
          SolomonDarkModLoader/src/mod_settings_persistence.cpp
          tests/native/mod_settings_validation_vectors_tests.cpp
          -o /tmp/mod-settings-validation-tests
          && /tmp/mod-settings-validation-tests
          tests/fixtures/mod-settings-validation-vectors.json
      - name: Test mod-settings lifecycle verifier
        run: python -m unittest tests.test_mod_settings_lifecycle_verifier
      - name: Test multiplayer interpolation and packet sizing
        run: >-
          g++ -std=c++17 -pthread
          -ISolomonDarkModLoader/include
          SolomonDarkModLoader/src/multiplayer_runtime_state.cpp
          SolomonDarkModLoader/src/multiplayer_runtime_labels.cpp
          tests/native/multiplayer_runtime_state_tests.cpp
          -o /tmp/multiplayer-runtime-state-tests
          && /tmp/multiplayer-runtime-state-tests
      - name: Test partial multi-enemy motion fragments
        run: >-
          g++ -std=c++17
          -ISolomonDarkModLoader/include
          tests/native/world_motion_fragment_merge_tests.cpp
          -o /tmp/world-motion-fragment-merge-tests
          && /tmp/world-motion-fragment-merge-tests
      - name: Test Steam gameplay send backpressure
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -ISolomonDarkModLoader/include
          SolomonDarkModLoader/src/multiplayer_steam_gameplay_queue_policy.cpp
          tests/native/steam_gameplay_queue_policy_tests.cpp
          -o /tmp/steam-gameplay-queue-policy-tests
          && /tmp/steam-gameplay-queue-policy-tests
      - name: Test x86 hook instruction relocation
        run: >-
          g++ -std=c++17 -Wall -Wextra -pedantic
          -ISolomonDarkModLoader/include
          tests/native/x86_hook_decoder_tests.cpp
          -o /tmp/x86-hook-decoder-tests
          && /tmp/x86-hook-decoder-tests
      - name: Test multiplayer run-entry stability verifier
        run: >-
          python -m unittest
          tests.test_multiplayer_run_entry_stability_verifier
      - name: Test organic enemy and Air timing verifier
        run: >-
          python -m unittest
          tests.test_multiplayer_organic_enemy_cast_timing_verifier
      - name: Test enemy retarget acceptance verifier
        run: >-
          python -m unittest
          tests.test_multiplayer_enemy_retarget_verifier
      - name: Test isolated local multiplayer cleanup
        run: python -m unittest tests.test_local_multiplayer_process_isolation
      - name: Test Lua multiplayer net verifier
        run: python -m unittest tests.test_lua_net_multiplayer_verifier
      - name: Test Lua multiplayer time verifier
        run: python -m unittest tests.test_lua_time_multiplayer_verifier
      - name: Test Lua multiplayer UI verifier
        run: python -m unittest tests.test_lua_ui_multiplayer_verifier
      - name: Test Lua multiplayer item verifier
        run: python -m unittest tests.test_lua_items_multiplayer_verifier
      - name: Test Lua multiplayer enemy verifier
        run: python -m unittest tests.test_lua_enemies_multiplayer_verifier
      - name: Test Lua multiplayer AI verifier
        run: python -m unittest tests.test_lua_ai_multiplayer_verifier
      - name: Test Lua multiplayer waves verifier
        run: python -m unittest tests.test_lua_waves_multiplayer_verifier
      - name: Test Lua multiplayer RNG verifier
        run: python -m unittest tests.test_lua_rng_multiplayer_verifier
      - name: Test Lua multiplayer scene verifier
        run: python -m unittest tests.test_lua_scene_multiplayer_verifier
      - name: Test Lua multiplayer navigation verifier
        run: python -m unittest tests.test_lua_nav_multiplayer_verifier
      - name: Test Lua multiplayer camera verifier
        run: python -m unittest tests.test_lua_camera_multiplayer_verifier
      - name: Test Lua multiplayer sprite verifier
        run: python -m unittest tests.test_lua_sprites_multiplayer_verifier
      - name: Test Lua multiplayer storage verifier
        run: python -m unittest tests.test_lua_storage_multiplayer_verifier
      - name: Test Lua multiplayer timer verifier
        run: python -m unittest tests.test_lua_timer_multiplayer_verifier
      - name: Test Lua multiplayer audio verifier
        run: python -m unittest tests.test_lua_audio_multiplayer_verifier
      - name: Test Lua multiplayer bus verifier
        run: python -m unittest tests.test_lua_bus_multiplayer_verifier
      - name: Test Lua multiplayer draw verifier
        run: python -m unittest tests.test_lua_draw_multiplayer_verifier
      - name: Test Lua multiplayer filter verifier
        run: python -m unittest tests.test_lua_filters_multiplayer_verifier
      - name: Verify all static Lua seam contracts
        run: python tests/re/run_static_re_tests.py --lua-only
